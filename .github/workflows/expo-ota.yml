name: Publish Expo OTA update

on:
  push:
    paths:
      - "apps/**"

permissions:
  contents: read

concurrency:
  group: expo-ota-production
  cancel-in-progress: false

jobs:
  publish:
    name: Publish production update
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure EAS Update
        working-directory: apps/mobile
        run: |-
          npx --no-install eas init --account kharitonovs-team --non-interactive
          npx --no-install eas update:configure --non-interactive

      - name: Publish update
        working-directory: apps/mobile
        run: >-
          npx --no-install eas update
          --branch production
          --message "GitHub Actions ${GITHUB_SHA}"
          --non-interactive
